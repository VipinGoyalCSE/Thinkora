name: exam_pilot
description: ExamPilot AI - Intelligent Study Agent
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  file_picker: ^8.1.4
  shimmer: ^3.0.0
  flutter_riverpod: ^2.4.0
  google_fonts: ^6.1.0
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_native_splash: ^2.4.0 # Yeh line add karo
  flutter_launcher_icons: ^0.13.1 # Add or update this line


flutter_native_splash:
  color: "#1E3A8A" # Aapka dark blue background color
  image: assets/images/thinkora_splash.png # Jo image aap dikhana chahte ho
  android: true
  ios: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon_thinkora.png" # The path to your image

flutter:
  assets:
    - assets/images/thinkora_splash.png
    - assets/images/image_2.png
    - assets/images/image_3.png
    - assets/images/login_base.png
    - assets/images/signup_base.png
  uses-material-design: true